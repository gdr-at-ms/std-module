name: macOS (Clang)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Homebrew LLVM + Ninja
        run: |
          brew install llvm ninja
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
      - name: Configure
        run: |
          cmake --preset clang \
            -DCMAKE_CXX_COMPILER=$(brew --prefix llvm)/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -L$(brew --prefix llvm)/lib/c++ -Wl,-rpath,$(brew --prefix llvm)/lib/c++"
      - name: Build
        run: cmake --build --preset clang
      - name: Test
        run: ctest --preset clang
